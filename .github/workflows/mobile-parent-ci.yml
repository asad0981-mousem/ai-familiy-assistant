name: Mobile Parent CI

# به‌ازای هر push/PR روی mobile-parent/، وابستگی‌های pub.dev را واقعاً Resolve، flutter analyze
# (بررسی کامل نوع‌ها/Lint) و flutter test (شامل تست‌های واقعی ApiClient با MockClient روی قرارداد
# دقیق DTO های بک‌اند) را اجرا می‌کند — همان تاییدی که در Sandbox توسعه (بدون دسترسی به pub.dev)
# ممکن نبود.
#
# آیتم باز: Build کامل iOS هنوز به این CI اضافه نشده (نیازمند Runner مک، که در این پروژه هنوز
# استفاده نشده — تصمیمی جداگانه و آگاهانه با هزینه/سرعت متفاوت). Build اندروید (APK Debug) در
# Job دوم زیر واقعاً تایید می‌شود.
#
# Scaffold پلتفرم اندروید (پوشه android/) در ریپو Commit نشده — عمداً، چون باید توسط خود ابزار
# flutter create تولید شود، نه دستی نوشته شود (این دقیقاً همان دلیلی است که این Job آن را در هر
# اجرا با خود ابزار واقعی می‌سازد، نه این‌که حدسی/دستی نوشته شده باشد). برای اجرای محلی روی
# ماشینی با دسترسی اینترنت، یک‌بار `flutter create --platforms=android --org com.aifamily .`
# را در پوشه mobile-parent اجرا کنید.
#
# نسخه Flutter عمداً پین شده (نه channel: stable بدون نسخه): نسخه‌های جدیدتر stable
# (مثلاً 3.50.0) اعلام کرده‌اند package:flutter/material.dart منسوخ شده و باید به
# package:material_ui/material_ui.dart مهاجرت کرد — مهاجرتی واقعی و بزرگ که باید آگاهانه و
# جداگانه انجام شود، نه این‌که به‌خاطر ارتقای خودکار Runner در CI به‌صورت ناگهانی قرمز شود.

on:
  push:
    paths:
      - "mobile-parent/**"
      - ".github/workflows/mobile-parent-ci.yml"
  pull_request:
    paths:
      - "mobile-parent/**"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-parent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: mobile-parent

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (برای Gradle/AGP، هماهنگ با device-agent-ci.yml)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"

      - name: flutter pub get
        run: flutter pub get

      - name: Generate android/ scaffolding با خود ابزار flutter create (نه دستی)
        run: flutter create --platforms=android --org com.aifamily .

      - name: flutter build apk --debug
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-family-parent-debug-apk
          path: mobile-parent/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
