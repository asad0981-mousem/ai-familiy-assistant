name: Device Agent CI

# به‌ازای هر push/PR روی device-agent/، وابستگی‌های Gradle را واقعاً Resolve، تست‌های JVM
# (از جمله تست مقدار طلایی سازگاری با CommandSignerService سمت بک‌اند) را اجرا، و APK را
# کامپایل می‌کند — همان تاییدی که در Sandbox توسعه (بدون دسترسی به Google Maven/Maven Central)
# ممکن نبود.

on:
  push:
    paths:
      - "device-agent/**"
      - ".github/workflows/device-agent-ci.yml"
  pull_request:
    paths:
      - "device-agent/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device-agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests — CommandSigner (Golden Value سازگار با command-signer.service.spec.ts)
        run: ./gradlew test --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-agent-unit-test-reports
          path: device-agent/app/build/reports/tests

      - name: Assemble debug APK (کامپایل کامل، نه فقط Syntax Check)
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: device-agent-debug-apk
          path: device-agent/app/build/outputs/apk/debug/*.apk
