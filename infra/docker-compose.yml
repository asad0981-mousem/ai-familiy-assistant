version: "3.9"

# AI Family Assistant — Local Development Infrastructure
# طبق فاز ۴ (معماری فنی) و فاز ۱۷ (Database Schema نهایی Blueprint)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aifamily-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifamily
      POSTGRES_PASSWORD: aifamily_dev_password
      POSTGRES_DB: aifamily_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifamily -d aifamily_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aifamily-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
